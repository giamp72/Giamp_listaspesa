body{padding:0 0 calc(100px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(16px,calc((100vw - 760px)/2 + 16px)) 12px;background:var(--bar);border-bottom:1px solid var(--bd);color:var(--tx);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
header h1{overflow:hidden;margin:0;white-space:nowrap;text-overflow:ellipsis;font-size:19px;font-weight:700;letter-spacing:-.035em}
main{max-width:760px;margin:0 auto;padding:14px 16px 24px}
nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;z-index:20;display:flex;width:min(560px,calc(100% - 28px));justify-content:space-around;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));transform:translateX(-50%);border:1px solid var(--bd);border-radius:28px;background:var(--bar);box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}

nav button span{font-size:19px;line-height:1;filter:none;transition:transform .18s ease}
nav button.on{background:var(--selBg);color:var(--accent);font-weight:700}
nav button.on span{transform:translateY(-1px)}
.card{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:13px 14px;border:1px solid var(--bd);border-radius:18px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.035)}
.card.col{align-items:stretch;flex-direction:column}
.grow{min-width:0;flex:1}
h2{margin:18px 4px 8px;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
h2.cath{display:flex;align-items:center;gap:10px;margin:16px 0 8px;padding:11px 13px;border:1px solid var(--bd);border-radius:15px;background:var(--card);color:var(--tx);cursor:pointer;user-select:none}
h2.cath .chev{display:inline-grid;width:26px;height:26px;flex:none;place-items:center;border:1px solid var(--bd);border-radius:9px;background:var(--card2);color:var(--accent);font-size:13px}
h2.cath .cnt{margin-left:auto;color:var(--mu);font-size:13px;font-weight:600;letter-spacing:0}
.expbar{display:flex;gap:8px;margin:4px 0 8px}
.expbar .b{flex:1;padding:9px 10px;font-size:12px}
input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--bd);border-radius:14px;outline:none;background:var(--inp);color:var(--tx);font:inherit;font-size:15px}
input::placeholder{color:var(--mu);opacity:.8}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
button.b{padding:10px 15px;border:0;border-radius:14px;background:var(--pri);color:var(--pri-tx);font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
button.b:active{transform:scale(.97)}
button.b:disabled{opacity:.4}
button.b.ok{background:var(--ok);color:#fff}
button.b.gh{border:1px solid var(--bd);background:var(--card2);color:var(--tx)}
button.b.rd{border:1px solid color-mix(in srgb,var(--danger) 18%,transparent);background:color-mix(in srgb,var(--danger) 10%,var(--card2));color:var(--danger)}
img.th{width:48px;height:48px;flex:none;border:1px solid var(--bd);border-radius:14px;background:var(--card2);object-fit:cover;cursor:pointer}

.done .chk{border-color:var(--ok);background:var(--ok);color:#fff}
.sel .chk{border-color:var(--accent);background:var(--accent);color:#fff}
.card.sel{border-color:color-mix(in srgb,var(--accent) 40%,var(--bd));background:var(--selBg)}
.done{background:var(--doneBg)}
.done .product-name{text-decoration:line-through;color:var(--mu)}
.bar{height:8px;overflow:hidden;margin:10px 0;border-radius:99px;background:var(--track)}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--ok);transition:width .3s}
.mu{color:var(--mu);font-size:13px}
#offlineNotice{padding:8px 16px;background:var(--card2);text-align:center}
#offlineNotice[hidden]{display:none}
#login{max-width:390px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 18px 20px}
#login h1{margin:8px 0 16px;font-size:24px;letter-spacing:-.04em}
#login .card{padding:22px}
#login .card>button{width:100%;min-height:46px}
.qtybox{display:flex;flex:none;align-items:center;gap:8px;padding:4px;border:1px solid var(--bd);border-radius:14px;background:var(--card2)}
.qtybox button{width:32px;height:32px;border:0;border-radius:10px;background:var(--btn2);color:var(--accent);font-size:20px;font-weight:600;line-height:1;cursor:pointer}
.qtybox span{min-width:22px;color:var(--tx);font-size:14px;font-weight:700;text-align:center}
.small-actions{display:flex;align-items:center;gap:6px}

.row{display:flex;align-items:center;gap:8px}
.camera-label{display:inline-flex;align-items:center;justify-content:center}
.item-card{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px}

.product-meta{margin-top:3px;color:var(--mu);font-size:13px}
.shop-view .product-name{font-size:18px}

.wide-btn{width:100%}

.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(0,0,0,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal.open{display:flex}
.modal img{max-width:100%;max-height:88vh;border-radius:20px;background:#111;box-shadow:var(--shadow)}
.modal .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border:1px solid var(--bd);border-radius:50%;background:var(--card2);color:var(--tx);font-size:24px;cursor:pointer}
.backdrop{position:fixed;inset:0;z-index:55;display:none;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.backdrop.open{display:block}

.modal-panel textarea{width:100%;min-height:280px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--inp);color:var(--tx);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;resize:vertical}
.modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.list-actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.list-actions .b{flex:1 1 140px}
.filter-box{margin:0 0 8px}

.hl{min-width:0;flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.setrow>span:first-child{font-weight:500}

.password-field{position:relative;width:100%}

function captureFocus(){
  const el=document.activeElement;
  if(!el||!el.id||el.tagName!=='INPUT')return null;
  return {id:el.id,s:el.selectionStart,e:el.selectionEnd};
}
function restoreFocus(st){
  if(!st)return;
  const el=document.getElementById(st.id);
  if(!el)return;
  el.focus();
  try{if(st.s!=null)el.setSelectionRange(st.s,st.e);}catch(e){}
}

async function saveLoyalty(file){
  if(!file)return;
  if(!S.user)return alert(t('signInToSaveCard'));
  try{
    const imageData=await new Promise((resolve,reject)=>{
      const img=new Image(),u=URL.createObjectURL(file);
      img.onload=()=>{try{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const ctx=c.getContext('2d');if(!ctx)throw new Error(t('imageProcessing'));ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.9));}catch(e){reject(e);}finally{URL.revokeObjectURL(u);}};
      img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error(t('invalidImage')));};
      img.src=u;
    });
    const {error}=await sb.from('loyalty_cards').upsert({user_id:S.user.id,image_data:imageData,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)throw error;
    S.loyaltyImg=imageData;
    hideDialog();
    openSettings();
  }catch(e){alert(e.message||t('saveCardError'));}
}
async function loadLoyalty(){

  if(data?.image_data){S.loyaltyImg=data.image_data;return;}
  const legacy=LS.get('loyaltyImg');
  if(!legacy){S.loyaltyImg=null;return;}
  const {error:saveError}=await sb.from('loyalty_cards').upsert({user_id:S.user.id,image_data:legacy},{onConflict:'user_id'});
  if(saveError){S.loyaltyImg=legacy;alert(`${t('migrateCardError')} ${saveError.message}`);return;}
  S.loyaltyImg=legacy;
  try{localStorage.removeItem('loyaltyImg');}catch{}
}

async function importJsonToCurrentList(data){if(!S.listId) throw new Error(t('noListSelected'));if(!data||!Array.isArray(data.categorie)||typeof data.prodotti!=='object'){alert(t('invalidJsonFormat'));return;}const listId=S.listId;await sb.from('list_items').delete().eq('list_id',listId);await sb.from('products').delete().eq('list_id',listId);await sb.from('categories').delete().eq('list_id',listId);const categoryMap=new Map();for(let i=0;i<data.categorie.length;i++){const name=data.categorie[i];const ins=await sb.from('categories').insert({list_id:listId,name,position:i}).select().single();if(ins.data) categoryMap.set(name,ins.data.id)}for(const catName of data.categorie){const catId=categoryMap.get(catName);const items=Array.isArray(data.prodotti[catName])?data.prodotti[catName]:[];for(const item of items){const obj=typeof item==='string'?{descrizione:item,immagine:null}:item;if(!obj.descrizione) continue;await sb.from('products').insert({list_id:listId,description:obj.descrizione,category_id:catId,image_url:obj.immagine||null})}}}

function vCats(){const cs=orderedCats();const selected=selectedCatId && cs.some(c=>c.id===selectedCatId)?selectedCatId:null;if(!selected && cs.length) selectedCatId=cs[0].id;const activeSelected=selected || selectedCatId;$('view').innerHTML=`<div class="card"><input id="nc" placeholder="${t('newCategory')}"><button class="b" onclick="addCat()">${t('add')}</button></div><div class="mu" style="margin:0 4px 8px">${t('categoryOrder')}</div>${cs.map((c,i)=>{const isSelected=c.id===activeSelected;const row=`<div class="card ${isSelected?'sel':''}" data-cat-id="${c.id}" onclick="selectCat('${c.id}')"><div class="grow"><b>${esc(c.name)}</b></div>${isSelected?`<button class="b gh" aria-label="${t('moveUp')}" ${i===0?'disabled':''} onclick="event.stopPropagation(); moveCat(${i},-1)">↑</button><button class="b gh" aria-label="${t('moveDown')}" ${i===cs.length-1?'disabled':''} onclick="event.stopPropagation(); moveCat(${i},1)">↓</button><button class="b gh" aria-label="${t('rename')}" onclick="event.stopPropagation(); renCat('${c.id}')">${icon('edit')}</button><button class="b rd" aria-label="${t('delete')}" onclick="event.stopPropagation(); delCat('${c.id}')">${icon('trash')}</button>`:''}</div>`;return row;}).join('')}`;}
function selectCat(id){selectedCatId=id;render();}
async function addCat(){const n=$('nc').value.trim();if(!n) return;const pos=S.cats.length?Math.max(...S.cats.map(c=>Number(c.position)))+1:0;const r=await sb.from('categories').insert({name:n,position:pos,list_id:S.listId}).select().single();if(r.error) alert(r.error.message);if(r.data) selectedCatId=r.data.id;reload();}
async function moveCat(i,d){const arr=orderedCats();if(!arr[i+d]) return;[arr[i],arr[i+d]]=[arr[i+d],arr[i]];await Promise.all(arr.map((c,k)=>sb.from('categories').update({position:k}).eq('id',c.id)));const movedId=arr[i+d]?.id || arr[i]?.id;selectedCatId=movedId;reload();}
async function renCat(id){const n=prompt(t('newName'));if(n){await sb.from('categories').update({name:n}).eq('id',id);reload();}}
async function delCat(id){if(!confirm(t('deleteCategoryConfirm'))) return;const r=await sb.from('categories').delete().eq('id',id);if(r.error) alert(t('categoryInUse'));if(selectedCatId===id) selectedCatId=null;reload();}

/* ---- prodotti ---- */
const filterBox=id=>`<div class="card filter-box"><input id="${id}" placeholder="${t('searchProduct')}" value="${esc(filterText)}" oninput="filterText=this.value; render();"></div>`;
const prodRow=(p,showCat)=>`<div class="card"><div class="item-card">${thumb(p)}<div class="grow"><div class="product-name">${esc(p.description)}</div>${showCat?`<div class="product-meta">${esc(catName(p.category_id))}</div>`:''}</div><div class="small-actions"><button class="b gh" aria-label="${t('editProduct')}" onclick="editProd('${p.id}')">${icon('edit')}</button><button class="b rd" aria-label="${t('delete')}" onclick="delProd('${p.id}')">${icon('trash')}</button></div></div></div>`;
function vProds(){
  const cats=orderedCats();
  const all=S.prods.filter(p=>matchesFilter(filterText,p));
  let listHtml;
  if(FLAT){
    listHtml=all.length?[...all].sort(alpha).map(p=>prodRow(p,true)).join(''):`<div class="card">${t('noProducts')}</div>`;
  } else {
    listHtml=cats.map(c=>{
      const ps=all.filter(p=>p.category_id===c.id).sort(alpha);
      if(!ps.length) return '';
      return catHead('prods',c.id,c.name,ps.length)+(isCol(colKey('prods',c.id))?'':ps.map(p=>prodRow(p,false)).join(''));
    }).join('')||`<div class="card">${t('noProducts')}</div>`;
  }
  $('view').innerHTML=`
    ${filterBox('prodFilter')}
    ${flatBar()}
    ${FLAT?'':expBar('prods')}
    ${listHtml}
    <div class="card col"><input id="pd" placeholder="${t('productDescription')}"><select id="pc">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="row"><label class="b gh camera-label" for="pi">${icon('camera')}${t('photo')}</label><input id="pi" type="file" accept="image/*" capture="environment" style="display:none"></div><button class="b wide-btn" onclick="addProd()">${t('addProduct')}</button></div>`;
}
async function uploadProductImage(file){if(!file) return null;const path=crypto.randomUUID()+'-'+file.name.replace(/[^\w.]/g,'_');const u=await sb.storage.from('product-images').upload(path,file);if(u.error) throw new Error(u.error.message);return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;}
async function addProd(){const d=$('pd').value.trim(),c=$('pc').value;if(!d||!c) return alert(t('addProductValidation'));try{const f=$('pi').files[0];const url=await uploadProductImage(f);const r=await sb.from('products').insert({description:d,category_id:c,image_url:url,list_id:S.listId});if(r.error) alert(r.error.message);reload();}catch(e){alert(e.message||t('photoUploadError'));}}
async function editProd(id){const p=prod(id);if(!p) return;const cats=orderedCats();showDialog(`<div class="modal-panel"><h3>${t('editProduct')}</h3><div class="card col" style="margin:0"><input id="editProdDesc" value="${esc(p.description)}" placeholder="${t('productDescription')}"><select id="editProdCat">${cats.map(c=>`<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="${esc(p.description)}" style="width:80px;height:80px;align-self:center">`:''}<div class="row"><label class="b gh camera-label" for="editProdImg">${icon('camera')}${t('changePhoto')}</label><input id="editProdImg" type="file" accept="image/*" capture="environment" style="display:none"></div>${p.image_url?`<button class="b rd" onclick="removeProductImage('${id}')">${icon('trash')}${t('removePhoto')}</button>`:''}<div class="modal-actions"><button class="b gh" onclick="hideDialog()">${t('cancel')}</button><button class="b" onclick="saveProductEdit('${id}')">${t('save')}</button></div></div></div>`);}
async function removeProductImage(id){const p=prod(id);if(!p) return;if(!confirm(t('removePhotoConfirm'))) return;try{await sb.from('products').update({image_url:null}).eq('id',id);hideDialog();reload();}catch(e){alert(e.message||t('photoRemoveError'));}}
async function saveProductEdit(id){const p=prod(id);if(!p) return;const desc=$('editProdDesc').value.trim();const cat=$('editProdCat').value;if(!desc||!cat) return alert(t('saveProductValidation'));try{const f=$('editProdImg')?.files?.[0];const payload={description:desc,category_id:cat};if(f){payload.image_url=await uploadProductImage(f);}else if(!f && !p.image_url && $('editProdImg') && $('editProdImg').files && $('editProdImg').files.length===0 && !p.image_url){payload.image_url=null;}await sb.from('products').update(payload).eq('id',id);hideDialog();reload();}catch(e){alert(e.message||t('productSaveError'));}}
async function delProd(id){if(confirm(t('deleteProductConfirm'))){await sb.from('products').delete().eq('id',id);reload();}}

/* ---- lista (selezione articoli) ---- */
function pickRow(p,showCat){
  const item=S.items.find(i=>i.product_id===p.id);
  const qty=item?Number(item.quantity||1):1;
  const selected=!!item;
  return `<div class="card ${selected?'sel':''}" onclick="toggleItem('${p.id}')"><div class="chk">${selected?'✓':''}</div>${thumb(p)}<div class="grow"><div class="product-name">${esc(p.description)}</div>${showCat?`<div class="product-meta">${esc(catName(p.category_id))}</div>`:''}</div><div class="qtybox" onclick="event.stopPropagation();"><button type="button" onclick="event.stopPropagation(); changeQty('${p.id}', -1)">−</button><span>${qty}</span><button type="button" onclick="event.stopPropagation(); changeQty('${p.id}', 1)">+</button></div></div>`;
}
function vPick(){
  if(!S.listId) return $('view').innerHTML=`<div class="card">${t('noList')}</div>`;
  const all=S.prods.filter(p=>matchesFilter(filterText,p));
  let body;
  if(FLAT){
    body=all.length?[...all].sort(alpha).map(p=>pickRow(p,true)).join(''):`<div class="card">${t('noProducts')}</div>`;
  } else {
    body=orderedCats().map(c=>{
      const ps=all.filter(p=>p.category_id===c.id).sort(alpha);
      if(!ps.length) return '';
      const nSel=ps.filter(p=>S.items.find(i=>i.product_id===p.id)).length;
      return catHead('pick',c.id,c.name,nSel?`${nSel}/${ps.length}`:ps.length)+(isCol(colKey('pick',c.id))?'':ps.map(p=>pickRow(p,false)).join(''));
    }).join('')||`<div class="card">${t('noProducts')}</div>`;
  }
  $('view').innerHTML=`${filterBox('pickFilter')}${flatBar()}${FLAT?'':expBar('pick')}${body}<div class="pick-add-spacer"></div><button class="b pick-add-btn" onclick="openAddProductModal()">${icon('cart')}${t('addProduct')}</button>`;
}
function openAddProductModal(){
  if(!S.listId)return alert(t('selectListFirst'));
  const cats=orderedCats();
  if(!cats.length)return alert(t('addProductFirst'));
  showDialog(`<form class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="addProductTitle" onsubmit="event.preventDefault(); addProductFromPick()"><h3 id="addProductTitle">${t('addProduct')}</h3><label for="pickProductDesc">${t('description')}</label><input id="pickProductDesc" placeholder="${t('productDescription')}" required><label for="pickProductCat">${t('category')}</label><select id="pickProductCat" required>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="modal-actions"><button type="button" class="b gh" onclick="hideDialog()">${t('cancel')}</button><button id="pickProductSubmit" type="submit" class="b">${t('add')}</button></div></form>`);
  $('pickProductDesc').focus();
}
async function addProductFromPick(){
  const description=$('pickProductDesc').value.trim(),categoryId=$('pickProductCat').value;
  if(!description||!categoryId)return alert(t('saveProductValidation'));
  const button=$('pickProductSubmit');
  button.disabled=true;
  try{
    const {error}=await sb.from('products').insert({description,category_id:categoryId,image_url:null,list_id:S.listId});
    if(error)throw error;
    hideDialog();
    filterText='';
    await reload();
  }catch(e){
    alert(e.message||t('addProductError'));
    if($('pickProductSubmit'))$('pickProductSubmit').disabled=false;
  }
}
function dbFail(r){if(r&&r.error){alert(r.error.message);reload();}}
function toggleItem(pid){const ex=S.items.find(i=>i.product_id===pid);if(ex){S.items=S.items.filter(i=>i!==ex);render();sb.from('list_items').delete().eq('id',ex.id).then(dbFail);}else{const row={id:crypto.randomUUID(),list_id:S.listId,product_id:pid,quantity:1,status:'to_buy'};S.items=[...S.items,row];render();sb.from('list_items').insert(row).then(dbFail);}}
function changeQty(pid,delta){const item=S.items.find(i=>i.product_id===pid);const current=item?Number(item.quantity||1):1;const next=Math.max(1,current+delta);if(!item){const row={id:crypto.randomUUID(),list_id:S.listId,product_id:pid,quantity:next,status:'to_buy'};S.items=[...S.items,row];render();sb.from('list_items').insert(row).then(dbFail);}else{item.quantity=next;render();sb.from('list_items').update({quantity:next}).eq('id',item.id).then(dbFail);}}

/* ---- spesa ---- */
function vShop(){
  if(!S.listId) return $('view').innerHTML=`<div class="card">${t('noList')}</div>`;
  const items=S.items||[];
  const toBuy=items.filter(i=>i.status!=='purchased');
  const bought=items.filter(i=>i.status==='purchased');
  const tot=toBuy.length+bought.length;
  const done=bought.length;
  const cats=orderedCats();
  let html=`<div class="card col"><b>${t('cartRemaining',{remaining:toBuy.length,total:tot})}</b><div class="bar"><i style="width:${tot?(done/tot)*100:0}%"></i></div><button class="b ok wide-btn" onclick="closeCart()">${icon('cart')}${t('closeCart')}</button></div>`;
  if(toBuy.length){
    html+=cats.map(c=>{
      const its=toBuy.filter(i=>prod(i.product_id)?.category_id===c.id);
      if(!its.length) return '';
      return catHead('shop',c.id,c.name,its.length)+(isCol(colKey('shop',c.id))?'':its.map(i=>{const p=prod(i.product_id);return `<div class="card" onclick="buy('${i.id}', true)"><div class="chk"></div><div class="grow"><div class="product-name">${esc(p.description)}</div><div class="product-meta">${t('quantity')} ${i.quantity||1}</div></div>${p.image_url?thumb(p):''}</div>`;}).join(''));
    }).join('');
  } else {
    html+=`<div class="card">${t('noProductsBuy')}</div>`;
  }
  if(bought.length){
    const bv=bought.filter(i=>prod(i.product_id));
    if(bv.length){
      html+=catHead('shop','bought',t('purchased'),bv.length);
      if(!isCol(colKey('shop','bought'))){
        html+=cats.map(c=>bv.filter(i=>prod(i.product_id)?.category_id===c.id).map(i=>{const p=prod(i.product_id);return `<div class="card done" onclick="buy('${i.id}', false)"><div class="chk">✓</div><div class="grow"><div class="product-name">${esc(p.description)}</div><div class="product-meta">${t('quantity')} ${i.quantity||1}</div></div>${p.image_url?thumb(p):''}</div>`;}).join('')).join('');
      }
    }
  }
  $('view').innerHTML=`<div class="shop-view">${html}</div>`;
}
function buy(id,v){const it=S.items.find(i=>i.id===id);if(it)it.status=v?'purchased':'to_buy';render();sb.from('list_items').update({status:v?'purchased':'to_buy',updated_at:new Date().toISOString()}).eq('id',id).then(dbFail);}
async function closeCart(){if(!confirm(t('closeCartConfirm'))) return;await sb.from('list_items').delete().eq('list_id',S.listId).eq('status','purchased');reload();}
function openPhotoModal(url){$('photoModalImg').src=url;$('photoModal').classList.add('open');}
function hidePhotoModal(){$('photoModal').classList.remove('open');$('photoModalImg').src='';}
function closePhotoModal(event){if(event.target.id==='photoModal') hidePhotoModal();}
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(error=>console.error('Impossibile registrare il service worker:',error));
}
</script>
</body>
</html>
