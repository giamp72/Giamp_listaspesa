<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Lista della Spesa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#000;--card:#141414;--card2:#1c1c1c;--bd:#2b2b2b;--tx:#f1f1f1;--mu:#a1a1a1;--pri:#e4e4e4;--pri-tx:#0a0a0a;--ok:#7fc99a;--danger:#e08a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
body{padding-bottom:76px}
header{background:#0b0b0b;color:var(--tx);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
main{max-width:760px;margin:0 auto;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0;z-index:20}
nav button{background:none;border:0;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;min-width:0;flex:1}
nav button span{font-size:18px;line-height:1;filter:grayscale(1)}
nav button.on{color:var(--tx);font-weight:700}
nav button.on span{filter:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card.col{flex-direction:column;align-items:stretch}
.grow{flex:1;min-width:0}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:16px 4px 6px;font-weight:600}
h2.cath{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin:12px 0 6px;color:var(--tx)}
h2.cath .chev{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--card2);border:1px solid var(--bd);font-size:12px;color:var(--tx);flex:none}
h2.cath .cnt{margin-left:auto;color:var(--mu);font-weight:500;letter-spacing:0}
.expbar{display:flex;gap:8px;margin:2px 0 4px}
.expbar .b{flex:1;font-size:13px;padding:8px 10px}
input,select{padding:10px;background:#0d0d0d;color:var(--tx);border:1px solid var(--bd);border-radius:10px;font-size:14px;width:100%;outline:none}
input::placeholder{color:#767676}
input:focus,select:focus{border-color:#6b6b6b}
button.b{background:var(--pri);color:var(--pri-tx);border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
button.b:active{transform:scale(.98)}
button.b:disabled{opacity:.35}
button.b.ok{background:var(--ok);color:#06140c}
button.b.gh{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
button.b.rd{background:var(--card2);color:var(--danger);border:1px solid var(--bd)}
img.th{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#222;flex:none;border:1px solid var(--bd);cursor:pointer}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid #5a5a5a;display:grid;place-items:center;flex:none;font-size:15px;color:#fff;font-weight:700}
.done .chk{background:var(--ok);border-color:var(--ok);color:#06140c}
.sel .chk{background:var(--pri);border-color:var(--pri);color:var(--pri-tx)}
.card.sel{background:#171717;border-color:#6b6b6b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.done{background:#0d0d0d}
.done .product-name{text-decoration:line-through;color:var(--mu)}
.bar{height:8px;background:#262626;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.mu{color:var(--mu);font-size:12px}
#login{max-width:360px;margin:56px auto;padding:16px}
.qtybox{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:3px 5px;background:var(--card2);flex:none}
.qtybox button{width:28px;height:28px;border-radius:8px;border:0;background:#2a2a2a;color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;line-height:1}
.qtybox span{min-width:22px;text-align:center;font-weight:700;font-size:13px;color:var(--tx)}
.small-actions{display:flex;gap:6px;align-items:center}
.row{display:flex;gap:8px;align-items:center}
.camera-label{display:inline-flex;align-items:center;justify-content:center}
.password-field{display:flex;gap:6px;align-items:center}
.password-field input{flex:1;min-width:0}
.item-card{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.product-name{font-weight:600;line-height:1.3;word-break:break-word;color:var(--tx)}
.product-meta{font-size:12px;color:var(--mu);margin-top:2px}
.wide-btn{width:100%}
.list-avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--bd);font-size:18px;flex:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal img{max-width:100%;max-height:88vh;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#111}
.modal .close{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:999px;border:1px solid var(--bd);background:#1c1c1c;color:#f1f1f1;font-size:22px;cursor:pointer}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:55}
.backdrop.open{display:block}
.modal-panel{background:#101010;border:1px solid var(--bd);border-radius:14px;max-width:560px;width:100%;padding:14px}
.modal-panel h3{margin:0 0 8px;font-size:16px}
.modal-panel p{margin:8px 0;color:var(--mu);line-height:1.45}
.modal-panel textarea{min-height:280px;width:100%;background:#0d0d0d;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;font-size:12px;line-height:1.5;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.list-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.list-actions .b{flex:1 1 140px}
.filter-box{margin:0 0 8px}
@media (max-width:420px){.card{padding:8px 10px}.qtybox{padding:2px 4px}.list-actions{flex-direction:column}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card col">
    <h1>🛒 Lista della Spesa</h1>
    <input id="em" type="email" placeholder="Email">
    <div class="password-field"><input id="pw" type="password" placeholder="Password"><button class="b gh" type="button" onclick="togglePassword()" aria-label="Mostra password" aria-pressed="false">Mostra</button></div>
    <button class="b" onclick="auth(false)">Accedi</button>
    <button class="b gh" onclick="auth(true)">Registrati</button>
    <div id="lerr" class="mu"></div>
  </div>
</div>
<div id="app" hidden>
  <header>
    <h1 id="title">🛒 Spesa</h1>
    <div class="small-actions">
      <button class="b gh" onclick="reload()" title="Aggiorna">🔄</button>
      <button class="b gh" onclick="sb.auth.signOut()">Esci</button>
    </div>
  </header>
  <main id="view"></main>
  <nav>
    <button data-p="lists" onclick="go('lists')"><span>📋</span>Liste</button>
    <button data-p="cats" onclick="go('cats')"><span>🏷️</span>Categorie</button>
    <button data-p="prods" onclick="go('prods')"><span>📦</span>Prodotti</button>
    <button data-p="pick" onclick="go('pick')"><span>➕</span>Lista</button>
    <button data-p="shop" onclick="go('shop')"><span>🛍️</span>Spesa</button>
  </nav>
</div>
<div id="photoModal" class="modal" onclick="closePhotoModal(event)"><button class="close" aria-label="Chiudi" onclick="hidePhotoModal()">×</button><img id="photoModalImg" alt="Foto prodotto ingrandita"></div>
<div id="overlay" class="backdrop" onclick="closeDialog(event)"></div>
<div id="dialogHost" style="position:fixed;inset:0;z-index:56;display:none;align-items:center;justify-content:center;padding:16px;"></div>
<script>
const SUPABASE_URL='https://tdagxuyvckiageppiwbh.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkYWd4dXl2Y2tpYWdlcHBpd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTgzMDIsImV4cCI6MjEwNzI3NDMwMn0.rfAk_5IwT8NElUBbzKur1j17WPMCl_6UT2t1jud9JEU';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let S={cats:[],prods:[],lists:[],items:[],page:'lists',listId:localStorage.getItem('listId'),listName:'',userId:null};
let COL={};try{COL=JSON.parse(localStorage.getItem('collapsedCats')||'{}')}catch{COL={}}
let filterText='';
let FLAT=localStorage.getItem('flatView')==='1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s||'').toLowerCase().trim();
const matchesFilter=(text,prod)=>!text || normalize(prod.description).includes(normalize(text));
const orderedCats=()=>[...S.cats].sort((a,b)=>Number(a.position??0)-Number(b.position??0));
const alpha=(a,b)=>String(a.description||'').localeCompare(String(b.description||''),'it',{numeric:true,sensitivity:'base'});
const catName=id=>S.cats.find(c=>c.id===id)?.name||'';

/* ---- categorie comprimibili ---- */
const colKey=(page,id)=>page+':'+(S.listId||'')+':'+id;
const isCol=k=>!!COL[k];
function saveCol(){localStorage.setItem('collapsedCats',JSON.stringify(COL));}
function toggleCat(k){COL[k]=!COL[k];saveCol();render();}
function setAll(page,collapse){const ids=S.cats.map(c=>c.id);if(page==='shop')ids.push('bought');ids.forEach(id=>{COL[colKey(page,id)]=collapse;});saveCol();render();}
function catHead(page,id,name,count){const k=colKey(page,id);return `<h2 class="cath" onclick="toggleCat('${k}')"><span class="chev">${isCol(k)?'▸':'▾'}</span><span>${esc(name)}</span><span class="cnt">${count}</span></h2>`;}
const expBar=page=>`<div class="expbar"><button class="b gh" onclick="setAll('${page}',false)">▾ Espandi tutto</button><button class="b gh" onclick="setAll('${page}',true)">▸ Comprimi tutto</button></div>`;

/* ---- vista piatta A-Z ---- */
function toggleFlat(){FLAT=!FLAT;localStorage.setItem('flatView',FLAT?'1':'0');render();}
const flatBar=()=>`<div class="expbar"><button class="b gh" onclick="toggleFlat()">${FLAT?'🗂 Raggruppa per categoria':'🔤 Elenco A-Z senza categorie'}</button></div>`;

/* ---- focus preservato durante il filtro ---- */
function captureFocus(){
  const el=document.activeElement;
  if(!el||!el.id||el.tagName!=='INPUT')return null;
  return {id:el.id,s:el.selectionStart,e:el.selectionEnd};
}
function restoreFocus(st){
  if(!st)return;
  const el=document.getElementById(st.id);
  if(!el)return;
  el.focus();
  try{if(st.s!=null)el.setSelectionRange(st.s,st.e);}catch(e){}
}

async function auth(signup){const r=signup?await sb.auth.signUp({email:$('em').value,password:$('pw').value}):await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});$('lerr').textContent=r.error?r.error.message:(signup?'Controlla la mail per confermare (se richiesto).':'')}
function togglePassword(){const input=$('pw'),button=input.nextElementSibling;const showing=input.type==='password';input.type=showing?'text':'password';button.textContent=showing?'Nascondi':'Mostra';button.setAttribute('aria-label',showing?'Nascondi password':'Mostra password');button.setAttribute('aria-pressed',String(showing));}
sb.auth.onAuthStateChange((_e,session)=>{S.userId=session?.user?.id||null;$('login').hidden=!!session;$('app').hidden=!session;if(session)reload();});
async function reload(){
  const [c,p,l]=await Promise.all([sb.from('categories').select('*').order('position'),sb.from('products').select('*').order('description'),sb.from('shopping_lists').select('*').order('created_at')]);
  S.lists=l.data||[];
  if(!S.lists.find(x=>x.id===S.listId))S.listId=S.lists[0]?.id||null;
  S.cats=(c.data||[]).filter(x=>x.list_id===S.listId).sort((a,b)=>Number(a.position??0)-Number(b.position??0));
  S.prods=(p.data||[]).filter(x=>x.list_id===S.listId);
  S.listName=curList()?.name||'';
  if(S.listId){const i=await sb.from('list_items').select('*').eq('list_id',S.listId);S.items=i.data||[]}else S.items=[];
  render();
}
function go(p){S.page=p;render();}
const curList=()=>S.lists.find(l=>l.id===S.listId);
const prod=id=>S.prods.find(p=>p.id===id);
const thumb=p=>p?.image_url?`<img class="th" src="${esc(p.image_url)}" alt="${esc(p.description)}" onclick="event.stopPropagation(); openPhotoModal('${esc(p.image_url)}')">`:`<div class="list-avatar">🛒</div>`;
function render(){
  const f=captureFocus();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.page));
  $('title').textContent='🛒 '+(curList()?.name||'Spesa');
  ({lists:vLists,cats:vCats,prods:vProds,pick:vPick,shop:vShop})[S.page]();
  restoreFocus(f);
}
function showDialog(html){$('dialogHost').innerHTML=html;$('dialogHost').style.display='flex';$('overlay').classList.add('open');}
function hideDialog(){$('dialogHost').style.display='none';$('dialogHost').innerHTML='';$('overlay').classList.remove('open');}
function closeDialog(event){if(event.target.id==='overlay') hideDialog();}

/* ---- import / export ---- */
function exportListJson(){const list=curList();const cats=orderedCats();const productsByCat={};cats.forEach(cat=>{productsByCat[cat.name]=S.prods.filter(p=>p.category_id===cat.id).map(p=>({descrizione:p.description,immagine:p.image_url||null}))});return{lista:list?.name||'lista',categorie:cats.map(c=>c.name),prodotti:productsByCat};}
function openExportModal(){if(!S.listId) return alert('Seleziona una lista prima di esportare.');showDialog(`<div class="modal-panel"><h3>Esporta JSON</h3><p>Verrà scaricato un file con il nome della lista attiva. Il file contiene solo <b>categorie</b> e <b>prodotti</b>, incluse le immagini quando presenti.</p><textarea readonly>${esc(JSON.stringify(exportListJson(),null,2))}</textarea><div class="modal-actions"><button class="b gh" onclick="hideDialog()">Chiudi</button><button class="b" onclick="downloadExport()">Scarica JSON</button></div></div>`)}
function openImportModal(){if(!S.listId) return alert('Seleziona una lista prima di importare.');showDialog(`<div class="modal-panel"><h3>Importa JSON</h3><p><b>ATTENZIONE:</b> l'importazione <b>SOVRASCRIVE TUTTI</b> i dati di <b>categorie</b> e <b>prodotti</b> della lista attiva. I dati attuali verranno persi.</p><input id="importFile" type="file" accept="application/json,.json"><div class="modal-actions"><button class="b gh" onclick="hideDialog()">Annulla</button><button class="b rd" onclick="confirmImport()">Importa e sovrascrivi</button></div></div>`)}
function downloadExport(){const list=curList();const data=JSON.stringify(exportListJson(),null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${sanitizeFileName(list?.name||'lista')}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
function sanitizeFileName(name){return String(name).trim().replace(/[\\/:*?"<>|]+/g,'_')||'lista';}
async function confirmImport(){const file=$('importFile').files[0];if(!file) return alert('Seleziona un file JSON da importare.');if(!confirm('ATTENZIONE: questa operazione cancellerà tutte le categorie e i prodotti attuali della lista selezionata. Procedere?')) return;let parsed;try{parsed=JSON.parse(await file.text())}catch{return alert('Il file non è un JSON valido.')}await importJsonToCurrentList(parsed);hideDialog();reload();}
async function importJsonToCurrentList(data){if(!S.listId) throw new Error('Nessuna lista selezionata.');if(!data||!Array.isArray(data.categorie)||typeof data.prodotti!=='object'){alert('Formato JSON non valido.');return;}const listId=S.listId;await sb.from('list_items').delete().eq('list_id',listId);await sb.from('products').delete().eq('list_id',listId);await sb.from('categories').delete().eq('list_id',listId);const categoryMap=new Map();for(let i=0;i<data.categorie.length;i++){const name=data.categorie[i];const ins=await sb.from('categories').insert({list_id:listId,name,position:i}).select().single();if(ins.data) categoryMap.set(name,ins.data.id)}for(const catName of data.categorie){const catId=categoryMap.get(catName);const items=Array.isArray(data.prodotti[catName])?data.prodotti[catName]:[];for(const item of items){const obj=typeof item==='string'?{descrizione:item,immagine:null}:item;if(!obj.descrizione) continue;await sb.from('products').insert({list_id:listId,description:obj.descrizione,category_id:catId,image_url:obj.immagine||null})}}}

/* ---- liste ---- */
function vLists(){const hasList=!!S.listId;$('view').innerHTML=`<div class="card"><input id="nl" placeholder="Nuova lista (es. Esselunga)"><button class="b" onclick="addList()">Crea</button></div>${S.lists.map(l=>`<div class="card ${l.id===S.listId?'sel':''}"><div class="chk">${l.id===S.listId?'✓':''}</div><div class="grow" onclick="selList('${l.id}')"><b>${esc(l.name)}</b>${l.owner_id!==S.userId?'<div class="product-meta">Condivisa con te</div>':''}</div>${l.owner_id===S.userId?`<button class="b gh" onclick="openShareModal('${l.id}')">Condividi</button><button class="b rd" onclick="delList('${l.id}')">🗑</button>`:''}</div>`).join('')}<div class="list-actions">${hasList?`<button class="b gh" onclick="openExportModal()">Esporta lista</button><button class="b gh" onclick="openImportModal()">Importa lista</button>`:'<button class="b gh" onclick="alert(\'Seleziona una lista prima di esportare/importare.\')">Esporta/Importa</button>'}</div>`;}
async function addList(){const n=$('nl').value.trim();if(!n) return;const r=await sb.from('shopping_lists').insert({name:n}).select().single();if(r.data){S.listId=r.data.id;localStorage.setItem('listId',S.listId)}reload();}
function selList(id){S.listId=id;localStorage.setItem('listId',id);reload();}
async function delList(id){if(confirm('Eliminare la lista?')){await sb.from('shopping_lists').delete().eq('id',id);reload();}}
async function openShareModal(listId){const list=S.lists.find(l=>l.id===listId);if(!list||list.owner_id!==S.userId)return;const result=await sb.from('list_shares').select('shared_with_id,shared_with_email').eq('list_id',listId);if(result.error)return alert(result.error.message);showDialog(`<div class="modal-panel"><h3>Condividi “${esc(list.name)}”</h3><p>Inserisci l’email di un utente già registrato per condividere la lista.</p><div class="row"><input id="shareEmail" type="email" placeholder="Email utente"><button class="b" onclick="shareList('${listId}')">Condividi</button></div><h2>Utenti con accesso</h2>${(result.data||[]).map(share=>`<div class="card"><span class="grow">${esc(share.shared_with_email)}</span><button class="b rd" onclick="removeListShare('${listId}','${share.shared_with_id}')">Rimuovi</button></div>`).join('')||'<div class="mu">Nessun utente con cui condividere.</div>'}<div class="modal-actions"><button class="b gh" onclick="hideDialog()">Chiudi</button></div></div>`);}
async function shareList(listId){const email=$('shareEmail').value.trim();if(!email)return alert('Inserisci l’email dell’utente.');const result=await sb.rpc('share_list_with_email',{p_list_id:listId,p_email:email});if(result.error)return alert(result.error.message);openShareModal(listId);}
async function removeListShare(listId,userId){const result=await sb.from('list_shares').delete().eq('list_id',listId).eq('shared_with_id',userId);if(result.error)return alert(result.error.message);openShareModal(listId);}

/* ---- categorie ---- */
let selectedCatId=null;
function vCats(){const cs=orderedCats();const selected=selectedCatId && cs.some(c=>c.id===selectedCatId)?selectedCatId:null;if(!selected && cs.length) selectedCatId=cs[0].id;const activeSelected=selected || selectedCatId;$('view').innerHTML=`<div class="card"><input id="nc" placeholder="Nuova categoria"><button class="b" onclick="addCat()">Aggiungi</button></div><div class="mu" style="margin:0 4px 8px">Ordine di visualizzazione nella spesa.</div>${cs.map((c,i)=>{const isSelected=c.id===activeSelected;const row=`<div class="card ${isSelected?'sel':''}" data-cat-id="${c.id}" onclick="selectCat('${c.id}')"><div class="grow"><b>${esc(c.name)}</b></div>${isSelected?`<button class="b gh" ${i===0?'disabled':''} onclick="event.stopPropagation(); moveCat(${i},-1)">▲</button><button class="b gh" ${i===cs.length-1?'disabled':''} onclick="event.stopPropagation(); moveCat(${i},1)">▼</button><button class="b gh" onclick="event.stopPropagation(); renCat('${c.id}')">✏️</button><button class="b rd" onclick="event.stopPropagation(); delCat('${c.id}')">🗑</button>`:''}</div>`;return row;}).join('')}`;}
function selectCat(id){selectedCatId=id;render();}
async function addCat(){const n=$('nc').value.trim();if(!n) return;const pos=S.cats.length?Math.max(...S.cats.map(c=>Number(c.position)))+1:0;const r=await sb.from('categories').insert({name:n,position:pos,list_id:S.listId}).select().single();if(r.error) alert(r.error.message);if(r.data) selectedCatId=r.data.id;reload();}
async function moveCat(i,d){const arr=orderedCats();if(!arr[i+d]) return;[arr[i],arr[i+d]]=[arr[i+d],arr[i]];await Promise.all(arr.map((c,k)=>sb.from('categories').update({position:k}).eq('id',c.id)));const movedId=arr[i+d]?.id || arr[i]?.id;selectedCatId=movedId;reload();}
async function renCat(id){const n=prompt('Nuovo nome:');if(n){await sb.from('categories').update({name:n}).eq('id',id);reload();}}
async function delCat(id){if(!confirm('Eliminare la categoria?')) return;const r=await sb.from('categories').delete().eq('id',id);if(r.error) alert('Categoria in uso da dei prodotti.');if(selectedCatId===id) selectedCatId=null;reload();}

/* ---- prodotti ---- */
const filterBox=id=>`<div class="card filter-box"><input id="${id}" placeholder="Cerca prodotto..." value="${esc(filterText)}" oninput="filterText=this.value; render();"></div>`;
const prodRow=(p,showCat)=>`<div class="card"><div class="item-card">${thumb(p)}<div class="grow"><div class="product-name">${esc(p.description)}</div>${showCat?`<div class="product-meta">${esc(catName(p.category_id))}</div>`:''}</div><div class="small-actions"><button class="b gh" onclick="editProd('${p.id}')">✏️</button><button class="b rd" onclick="delProd('${p.id}')">🗑</button></div></div></div>`;
function vProds(){
  const cats=orderedCats();
  const all=S.prods.filter(p=>matchesFilter(filterText,p));
  let listHtml;
  if(FLAT){
    listHtml=all.length?[...all].sort(alpha).map(p=>prodRow(p,true)).join(''):'<div class="card">Nessun prodotto trovato.</div>';
  } else {
    listHtml=cats.map(c=>{
      const ps=all.filter(p=>p.category_id===c.id).sort(alpha);
      if(!ps.length) return '';
      return catHead('prods',c.id,c.name,ps.length)+(isCol(colKey('prods',c.id))?'':ps.map(p=>prodRow(p,false)).join(''));
    }).join('')||'<div class="card">Nessun prodotto trovato.</div>';
  }
  $('view').innerHTML=`
    ${filterBox('prodFilter')}
    ${flatBar()}
    ${FLAT?'':expBar('prods')}
    ${listHtml}
    <div class="card col"><input id="pd" placeholder="Descrizione prodotto"><select id="pc">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="row"><label class="b gh camera-label" for="pi">📷 Foto</label><input id="pi" type="file" accept="image/*" capture="environment" style="display:none"></div><button class="b wide-btn" onclick="addProd()">Aggiungi prodotto</button></div>`;
}
async function uploadProductImage(file){if(!file) return null;const path=crypto.randomUUID()+'-'+file.name.replace(/[^\w.]/g,'_');const u=await sb.storage.from('product-images').upload(path,file);if(u.error) throw new Error(u.error.message);return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;}
async function addProd(){const d=$('pd').value.trim(),c=$('pc').value;if(!d||!c) return alert('Inserisci descrizione e categoria');try{const f=$('pi').files[0];const url=await uploadProductImage(f);const r=await sb.from('products').insert({description:d,category_id:c,image_url:url,list_id:S.listId});if(r.error) alert(r.error.message);reload();}catch(e){alert(e.message||'Errore durante il caricamento della foto.');}}
async function editProd(id){const p=prod(id);if(!p) return;const cats=orderedCats();showDialog(`<div class="modal-panel"><h3>Modifica prodotto</h3><div class="card col" style="margin:0"><input id="editProdDesc" value="${esc(p.description)}" placeholder="Descrizione prodotto"><select id="editProdCat">${cats.map(c=>`<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="${esc(p.description)}" style="width:80px;height:80px;align-self:center">`:''}<div class="row"><label class="b gh camera-label" for="editProdImg">📷 Cambia foto</label><input id="editProdImg" type="file" accept="image/*" capture="environment" style="display:none"></div>${p.image_url?`<button class="b rd" onclick="removeProductImage('${id}')">🗑 Rimuovi foto</button>`:''}<div class="modal-actions"><button class="b gh" onclick="hideDialog()">Annulla</button><button class="b" onclick="saveProductEdit('${id}')">Salva</button></div></div></div>`);}
async function removeProductImage(id){const p=prod(id);if(!p) return;if(!confirm('Rimuovere la foto del prodotto?')) return;try{await sb.from('products').update({image_url:null}).eq('id',id);hideDialog();reload();}catch(e){alert(e.message||'Errore durante la rimozione della foto.');}}
async function saveProductEdit(id){const p=prod(id);if(!p) return;const desc=$('editProdDesc').value.trim();const cat=$('editProdCat').value;if(!desc||!cat) return alert('Inserisci descrizione e categoria.');try{const f=$('editProdImg')?.files?.[0];const payload={description:desc,category_id:cat};if(f){payload.image_url=await uploadProductImage(f);}else if(!f && !p.image_url && $('editProdImg') && $('editProdImg').files && $('editProdImg').files.length===0 && !p.image_url){payload.image_url=null;}await sb.from('products').update(payload).eq('id',id);hideDialog();reload();}catch(e){alert(e.message||'Errore durante il salvataggio del prodotto.');}}
async function delProd(id){if(confirm('Eliminare il prodotto?')){await sb.from('products').delete().eq('id',id);reload();}}

/* ---- lista (selezione articoli) ---- */
function pickRow(p,showCat){
  const item=S.items.find(i=>i.product_id===p.id);
  const qty=item?Number(item.quantity||1):1;
  const selected=!!item;
  return `<div class="card ${selected?'sel':''}" onclick="toggleItem('${p.id}')"><div class="chk">${selected?'✓':''}</div>${thumb(p)}<div class="grow"><div class="product-name">${esc(p.description)}</div>${showCat?`<div class="product-meta">${esc(catName(p.category_id))}</div>`:''}</div><div class="qtybox" onclick="event.stopPropagation();"><button type="button" onclick="event.stopPropagation(); changeQty('${p.id}', -1)">−</button><span>${qty}</span><button type="button" onclick="event.stopPropagation(); changeQty('${p.id}', 1)">+</button></div></div>`;
}
function vPick(){
  if(!S.listId) return $('view').innerHTML='<div class="card">Crea prima una lista.</div>';
  const all=S.prods.filter(p=>matchesFilter(filterText,p));
  let body;
  if(FLAT){
    body=all.length?[...all].sort(alpha).map(p=>pickRow(p,true)).join(''):'<div class="card">Nessun prodotto trovato.</div>';
  } else {
    body=orderedCats().map(c=>{
      const ps=all.filter(p=>p.category_id===c.id).sort(alpha);
      if(!ps.length) return '';
      const nSel=ps.filter(p=>S.items.find(i=>i.product_id===p.id)).length;
      return catHead('pick',c.id,c.name,nSel?`${nSel}/${ps.length}`:ps.length)+(isCol(colKey('pick',c.id))?'':ps.map(p=>pickRow(p,false)).join(''));
    }).join('')||'<div class="card">Nessun prodotto trovato.</div>';
  }
  $('view').innerHTML=`${filterBox('pickFilter')}${flatBar()}${FLAT?'':expBar('pick')}${body}`;
}
async function toggleItem(pid){const ex=S.items.find(i=>i.product_id===pid);if(ex){await sb.from('list_items').delete().eq('id',ex.id);}else{await sb.from('list_items').insert({list_id:S.listId,product_id:pid,quantity:1,status:'to_buy'});}reload();}
async function changeQty(pid,delta){const item=S.items.find(i=>i.product_id===pid);const current=item?Number(item.quantity||1):1;const next=Math.max(1,current+delta);if(!item){await sb.from('list_items').insert({list_id:S.listId,product_id:pid,quantity:next,status:'to_buy'});}else{await sb.from('list_items').update({quantity:next}).eq('id',item.id);}reload();}

/* ---- spesa ---- */
function vShop(){
  if(!S.listId) return $('view').innerHTML='<div class="card">Crea prima una lista.</div>';
  const items=S.items||[];
  const toBuy=items.filter(i=>i.status!=='purchased');
  const bought=items.filter(i=>i.status==='purchased');
  const tot=toBuy.length+bought.length;
  const done=bought.length;
  const cats=orderedCats();
  let html=`<div class="card col"><b>Mancano ${toBuy.length} prodotti su ${tot}</b><div class="bar"><i style="width:${tot?(done/tot)*100:0}%"></i></div><button class="b ok wide-btn" onclick="closeCart()">✅ Chiudi carrello</button></div>`;
  html+=filterBox('shopFilter');
  html+=expBar('shop');
  if(toBuy.length){
    html+=cats.map(c=>{
      const its=toBuy.filter(i=>prod(i.product_id)?.category_id===c.id && matchesFilter(filterText,prod(i.product_id)));
      if(!its.length) return '';
      return catHead('shop',c.id,c.name,its.length)+(isCol(colKey('shop',c.id))?'':its.map(i=>{const p=prod(i.product_id);return `<div class="card" onclick="buy('${i.id}', true)"><div class="chk"></div>${thumb(p)}<div class="grow"><div class="product-name">${esc(p.description)}</div><div class="product-meta">Quantità: ${i.quantity||1}</div></div></div>`;}).join(''));
    }).join('');
  } else {
    html+='<div class="card">Nessun prodotto da acquistare.</div>';
  }
  if(bought.length){
    const bv=bought.filter(i=>matchesFilter(filterText,prod(i.product_id)));
    if(bv.length){
      html+=catHead('shop','bought','Acquistati',bv.length);
      if(!isCol(colKey('shop','bought'))){
        html+=cats.map(c=>bv.filter(i=>prod(i.product_id)?.category_id===c.id).map(i=>{const p=prod(i.product_id);return `<div class="card done" onclick="buy('${i.id}', false)"><div class="chk">✓</div>${thumb(p)}<div class="grow"><div class="product-name">${esc(p.description)}</div><div class="product-meta">Quantità: ${i.quantity||1}</div></div></div>`;}).join('')).join('');
      }
    }
  }
  $('view').innerHTML=html;
}
async function buy(id,v){await sb.from('list_items').update({status:v?'purchased':'to_buy',updated_at:new Date().toISOString()}).eq('id',id);reload();}
async function closeCart(){if(!confirm('Chiudere il carrello? Gli articoli acquistati verranno rimossi dalla lista.')) return;await sb.from('list_items').delete().eq('list_id',S.listId).eq('status','purchased');reload();}
function openPhotoModal(url){$('photoModalImg').src=url;$('photoModal').classList.add('open');}
function hidePhotoModal(){$('photoModal').classList.remove('open');$('photoModalImg').src='';}
function closePhotoModal(event){if(event.target.id==='photoModal') hidePhotoModal();}
</script>
</body>
</html>
