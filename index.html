<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#18181B">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Gestisci le tue liste della spesa, ovunque ti trovi.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<title>Lista della Spesa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ---- temi: grigi scuri (predefinito) e chiaro; colore accento a scelta ---- */
:root{color-scheme:dark;--bg:#18181B;--card:#232327;--card2:#2B2B31;--field:#26262B;--raised:#34343B;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.16);--tx:#F4F4F5;--tx2:#D4D4D8;--mu:#A1A1AA;--faint:#71717A;--danger:#FB7185;--warn:#FBBF24;--on-accent:#0B1F14;--overlay:rgba(0,0,0,.55);--accent:#4ADE80;--accent-tx:var(--accent);--shadow:0 18px 40px rgba(0,0,0,.35)}
:root[data-theme=light]{color-scheme:light;--bg:#F2F2F7;--card:#FFFFFF;--card2:#F0F0F4;--field:#E6E6EB;--raised:#FFFFFF;--bd:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.16);--tx:#18181B;--tx2:#3F3F46;--mu:#5F5F67;--faint:#8E8E96;--danger:#E11D48;--warn:#B45309;--overlay:rgba(0,0,0,.35);--accent-tx:color-mix(in srgb,var(--accent) 45%,#000);--shadow:0 18px 40px rgba(0,0,0,.12)}
:root[data-accent=orange]{--accent:#FFB347}
:root[data-accent=blue]{--accent:#7DD3FC}
:root[data-accent=lilac]{--accent:#C4B5FD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;padding:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;letter-spacing:-.005em}
body{display:flex;height:100vh;height:100dvh;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{display:inline-block;width:20px;height:20px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}.icon.lg{width:22px;height:22px}
.mu{color:var(--mu);font-size:13px}

/* ---- struttura ---- */
#app:not([hidden]){display:flex;min-height:0;flex:1;flex-direction:column}
.app-content{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px 24px}
.dock{flex:none;display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px;margin:0 auto;padding:10px 14px max(14px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
#dockCta:empty{display:none}
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:64px;padding:6px;border:1px solid var(--bd);border-radius:32px;background:var(--field)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:26px;background:transparent;color:var(--mu);font-size:11px;font-weight:600;transition:background .18s,color .18s}
.tab.on{background:var(--raised);color:var(--tx);font-weight:700}
.tab .icon{width:22px;height:22px}
.badge{position:absolute;top:4px;left:54%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#3A2A00;font-size:11px;font-weight:800;line-height:18px;text-align:center}
:root[data-theme=light] .badge{color:#fff}
.app-footer{padding:4px 16px 18px;color:var(--faint);font-size:11px;text-align:center}
.app-footer a{color:inherit;text-decoration:none}

/* ---- intestazioni ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.topbar .actions{display:flex;gap:8px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{margin:0;color:var(--mu);font-size:13px;font-weight:600}
h1.title{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.subtitle{margin:4px 0 0;color:var(--mu);font-size:14px}
.pill-btn{display:flex;align-items:center;gap:8px;max-width:62%;height:38px;padding:0 12px 0 6px;border:1px solid var(--bd);border-radius:19px;background:var(--field);font-size:14px;font-weight:700}
.pill-btn .pill-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill-ini{display:grid;flex:none;width:26px;height:26px;place-items:center;border-radius:13px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800}
.icon-btn{display:grid;flex:none;width:42px;height:42px;place-items:center;border:1px solid var(--bd);border-radius:21px;background:var(--field)}
.icon-btn.solid{border:0;background:var(--accent);color:var(--on-accent)}
.chip-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:20px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:800}

/* ---- campi, segmenti, pulsanti ---- */
.search{position:relative;display:flex;align-items:center;gap:8px;height:44px;margin-bottom:14px;padding:0 12px;border-radius:12px;background:var(--field);color:var(--mu)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--tx);font-size:15px}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;margin-bottom:6px;padding:3px;border-radius:10px;background:var(--field)}
.seg button{height:32px;border:0;border-radius:8px;background:transparent;color:var(--mu);font-size:13px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>span{color:var(--mu);font-size:13px;font-weight:600}
.field input,.field select,.inline-form input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--bd);border-radius:14px;outline:none;background:var(--bg);color:var(--tx);font-size:15px}
.field input:focus,.field select:focus,.inline-form input:focus{border-color:var(--accent)}
.inline-form{display:flex;gap:8px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;white-space:nowrap}
.btn.ghost{background:var(--card2);color:var(--tx);font-weight:700}
.btn.danger{background:transparent;color:var(--danger);font-weight:700}
.btn.wide{width:100%}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:54px;padding:0 8px 0 20px;border:0;border-radius:27px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:800}
.cta.center{justify-content:center;padding:0 20px}
.cta-tag{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:20px;background:rgba(11,31,20,.14);font-size:14px}

/* ---- schede e righe ---- */
.card{margin-bottom:12px;padding:14px;border:1px solid var(--bd);border-radius:18px;background:var(--card)}
.group{overflow:hidden;border:1px solid var(--bd);border-radius:18px;background:var(--card)}
.row-item{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;cursor:pointer}
.row-item+.row-item{border-top:1px solid var(--bd)}
.row-main{flex:1;min-width:0}
.product-name{font-size:16px;font-weight:600;line-height:1.3;word-break:break-word}
.product-meta{margin-top:1px;color:var(--mu);font-size:13px}
img.th,.list-avatar{display:grid;width:44px;height:44px;flex:none;place-items:center;border-radius:12px;object-fit:cover}
img.th{border:1px solid var(--bd);background:var(--card2);cursor:zoom-in}
.list-avatar{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-size:17px;font-weight:800}
:root[data-theme=light] .list-avatar{color:color-mix(in srgb,var(--c) 55%,#000)}
.sec-head{display:flex;align-items:center;gap:10px;width:100%;padding:16px 2px 8px;border:0;background:transparent;color:var(--tx);text-align:left}
.sec-head .dot,.dot{width:10px;height:10px;flex:none;border-radius:5px;background:var(--c)}
.sec-name{flex:1;color:var(--tx2);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sec-count{color:var(--mu);font-size:13px;font-weight:600}
.sec-head .icon{color:var(--mu);transition:transform .18s}
.sec-head[aria-expanded=false] .icon{transform:rotate(-90deg)}
.stepper{display:flex;flex:none;align-items:center;gap:2px;height:36px;padding:0 3px;border-radius:18px;background:var(--accent);color:var(--on-accent)}
.stepper button{display:grid;width:30px;height:30px;place-items:center;border:0;border-radius:15px;background:rgba(11,31,20,.14);color:var(--on-accent)}
.stepper span{min-width:22px;text-align:center;font-size:15px;font-weight:800}
.add-circle{display:grid;flex:none;width:36px;height:36px;place-items:center;border:1.5px solid var(--bd2);border-radius:18px;background:transparent}
.dashed-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:14px;border:1.5px dashed var(--bd2);border-radius:18px;background:transparent;color:var(--tx2);font-size:15px;font-weight:700}

/* ---- suggerimenti ---- */
.sugg{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.sugg-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sugg-title{display:flex;align-items:center;gap:6px;color:var(--accent-tx);font-size:13px;font-weight:700}
.link-btn{padding:6px 4px;border:0;background:transparent;color:var(--mu);font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border:1px dashed var(--bd2);border-radius:18px;background:transparent;font-size:14px;font-weight:600}
.chip.more{border-style:solid;color:var(--mu)}

/* ---- pagina spesa ---- */
.ring-card{display:flex;align-items:center;gap:16px;margin-bottom:6px;padding:16px;border:1px solid var(--bd);border-radius:22px;background:var(--card)}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800}
.ring-text b{display:block;font-size:18px;font-weight:800}
.ring-text span{display:block;margin-top:2px;color:var(--mu);font-size:14px}
.shop-list{display:flex;flex-direction:column;gap:8px}
.shop-row{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;border:1px solid var(--bd);border-radius:18px;background:var(--card);text-align:left}
.shop-row .product-name{font-size:18px;font-weight:700}
.check-circle{display:grid;width:28px;height:28px;flex:none;place-items:center;border:2px solid var(--faint);border-radius:14px}
.qty-badge{flex:none;padding:4px 10px;border-radius:10px;background:var(--raised);font-size:14px;font-weight:800}
.shop-row.done{min-height:52px;border-color:transparent;background:var(--card2)}
.shop-row.done .product-name{color:var(--mu);font-size:16px;font-weight:600;text-decoration:line-through}
.shop-row.done .check-circle{border:0;background:var(--accent);color:var(--on-accent)}
.shop-row.done .qty-badge{background:transparent;color:var(--mu)}

/* ---- catalogo ---- */
.info-card{display:flex;align-items:flex-start;gap:12px}
.info-card .icon{color:var(--accent-tx);margin-top:1px}
.info-card b{display:block;font-size:15px}
.info-card span{display:block;margin-top:2px;color:var(--mu);font-size:14px;line-height:1.45}
.route{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.route li{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 6px 6px 12px;border:1px solid var(--bd);border-radius:16px;background:var(--card)}
.route .pos{display:grid;width:26px;height:26px;flex:none;place-items:center;border-radius:8px;background:var(--raised);color:var(--tx2);font-size:13px;font-weight:800}
.mini-btn{display:grid;width:40px;height:40px;flex:none;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--mu)}
.mini-btn:not(:disabled):hover{background:var(--card2);color:var(--tx)}

/* ---- impostazioni ---- */
.account{display:flex;align-items:center;gap:14px}
.avatar{display:grid;width:52px;height:52px;flex:none;place-items:center;border-radius:26px;background:var(--accent);color:var(--on-accent);font-size:20px;font-weight:800}
.set-title{margin:18px 4px 8px;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.set-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px}
.set-row+.set-row,.set-block+.set-row,.set-row+.set-block{border-top:1px solid var(--bd)}
.set-block{display:flex;flex-direction:column;gap:10px;padding:14px}
.set-label{flex:1;min-width:0;font-size:15px;font-weight:600}
.set-ico{display:grid;width:32px;height:32px;flex:none;place-items:center;border-radius:9px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.set-row select{min-height:36px;padding:0 10px;border:0;border-radius:10px;background:var(--card2);color:var(--tx);font-size:14px}
.swatches{display:flex;gap:10px}
.swatch{width:32px;height:32px;border:2px solid transparent;border-radius:16px;background:var(--c)}
.swatch[aria-pressed=true]{border-color:var(--tx);box-shadow:inset 0 0 0 3px var(--card)}
.switch{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:16px;background:var(--raised);transition:background .18s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.small-actions{display:flex;gap:6px}
.small-actions .btn{min-height:36px;padding:0 12px;border-radius:10px;font-size:13px}

/* ---- avvisi e stati vuoti ---- */
.banner{display:flex;align-items:center;gap:10px;max-width:640px;margin:10px auto 0;padding:10px 14px;border-radius:14px;background:var(--card2);color:var(--tx2);font-size:13px;font-weight:600}
#offlineNotice{width:calc(100% - 40px)}
#offlineNotice[hidden]{display:none}
.banner.err{flex-direction:column;align-items:stretch;margin:0 0 14px;border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.banner.err b{color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 16px;color:var(--mu);text-align:center}
.empty .icon{width:40px;height:40px;color:var(--faint)}
.empty b{color:var(--tx);font-size:17px}

/* ---- pannelli dal basso, foto, carta ---- */
.backdrop{position:fixed;inset:0;z-index:55;display:none;background:var(--overlay)}
.backdrop.open{display:block}
#dialogHost{position:fixed;inset:0;z-index:56;display:none;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;padding:10px 16px max(24px,env(safe-area-inset-bottom));border-top:1px solid var(--bd);border-radius:28px 28px 0 0;background:var(--card);box-shadow:var(--shadow);pointer-events:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;margin:0 auto 10px;border-radius:3px;background:var(--faint)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sheet p{margin:0 0 12px;color:var(--mu);line-height:1.5}
.sheet .group{background:var(--card2);margin-bottom:14px}
.sheet .row-item{min-height:60px}
.sheet textarea{width:100%;min-height:240px;margin-bottom:12px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.sheet-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:6px}
.action-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.action-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:16px;background:var(--card2);font-size:13px;font-weight:700}
.action-grid .icon{color:var(--accent-tx)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 14px;border:0;background:transparent;font-size:16px;font-weight:600;text-align:left}
.menu-item+.menu-item{border-top:1px solid var(--bd)}
.menu-item.danger{color:var(--danger)}
.photo-pick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo-pick img.th,.photo-pick .list-avatar{width:72px;height:72px;border-radius:16px;font-size:26px}
.check{display:grid;width:26px;height:26px;flex:none;place-items:center;border-radius:13px;background:var(--accent);color:var(--on-accent)}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.8)}
.modal.open{display:flex}
.modal img{max-width:100%;max-height:88vh;border-radius:20px;background:#111}
.modal .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;display:grid;width:42px;height:42px;place-items:center;border:0;border-radius:21px;background:rgba(255,255,255,.16);color:#fff;font-size:24px}
.modal.card-full{padding:0;background:#fff}
.modal.card-full img{width:100%;max-height:100dvh;border-radius:0;background:#fff;object-fit:contain}
.modal.card-full .close{background:rgba(0,0,0,.08);color:#111}

/* ---- accesso ---- */
#login{width:100%;max-width:400px;margin:auto;padding:calc(32px + env(safe-area-inset-top)) 20px 24px}
#login[hidden]{display:none}
.login-logo{display:grid;width:64px;height:64px;margin-bottom:18px;place-items:center;border-radius:20px;background:var(--accent);color:var(--on-accent)}
.login-logo .icon{width:32px;height:32px}
#login h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
#login .subtitle{margin:6px 0 22px}
.password-field{position:relative}
.password-field input{padding-right:52px}
.password-toggle{position:absolute;top:50%;right:5px;display:grid;width:40px;height:40px;transform:translateY(-50%);place-items:center;border:0;border-radius:12px;background:transparent;color:var(--mu)}
.login-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
#lerr{margin-top:12px;color:var(--mu);font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="login-logo"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9h16l-1.6 9.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8Z"/><path d="m8 9 4-5 4 5M10 13v3M14 13v3"/></svg></div>
  <h1 data-i18n="appName">Lista della Spesa</h1>
  <p class="subtitle" data-i18n="appDescription">Gestisci le tue liste della spesa, ovunque ti trovi.</p>
  <form onsubmit="event.preventDefault(); auth(false)">
    <label class="field"><span data-i18n="email">Email</span><input id="em" type="email" autocomplete="email" required></label>
    <label class="field"><span data-i18n="password">Password</span><span class="password-field"><input id="pw" type="password" autocomplete="current-password" required><button id="togglePassword" class="password-toggle" type="button" onclick="togglePasswordVisibility()" aria-label="Mostra password" title="Mostra password"></button></span></label>
    <div class="login-actions">
      <button class="btn wide" type="submit" data-i18n="signIn">Accedi</button>
      <button class="btn ghost wide" type="button" onclick="auth(true)" data-i18n="signUp">Registrati</button>
    </div>
  </form>
  <div id="lerr" role="status"></div>
</div>
<div id="app" hidden>
  <div class="app-content" id="scroller">

async function ensureListRouteOrder(){

function historyGroups(rows){
  const groups=new Map();
  for(const row of rows||[]){
    const desc=normalize(row.product_description||'');
    if(!desc)continue;
    const cat=normalize(row.category_name||'Generale');
    const key=`${desc}::${cat}`;
    if(!groups.has(key))groups.set(key,{description:row.product_description,category_name:normCategory(row.category_name),events:[]});
    groups.get(key).events.push({at:new Date(row.purchased_at),quantity:Number(row.quantity||1)});
  }
  return groups;
}
function dueProductsFromHistory(rows){
  const groups=historyGroups(rows);
  const now=new Date();
  const out=[];
  for(const group of groups.values()){
    const events=group.events.sort((a,b)=>a.at-b.at);
    if(events.length<2)continue;
    const deltas=[];
    for(let i=1;i<events.length;i++)deltas.push(daysBetween(events[i].at,events[i-1].at));
    const avgDays=Math.max(1,Math.round(deltas.reduce((a,b)=>a+b,0)/deltas.length));
    const last=events[events.length-1].at;
    const daysSince=daysBetween(now,last);
    const dueThreshold=Math.max(3,Math.round(avgDays*0.85));
    if(daysSince<dueThreshold)continue;
    const avgQty=Math.max(1,Math.round(events.reduce((a,b)=>a+b.quantity,0)/events.length));
    const score=(daysSince/avgDays)*Math.min(events.length,8);
    out.push({
      description:group.description,
      category_name:group.category_name,
      quantity:avgQty,
      score,
      daysSince,
      avgDays
    });
  }
  return out.sort((a,b)=>b.score-a.score);
}
/* ---- caricamento dati ----
   reloadSeq scarta le risposte di un reload superato da uno più recente.
   writeEpoch/pendingWrites evitano che un reload partito prima di una modifica
   sovrascriva lo stato ottimistico appena mostrato. */
let reloadSeq=0;
async function reload(){
  if(!S.user)return;
  const seq=++reloadSeq,epoch=writeEpoch;
  try{
    const l=must(await sb.from('shopping_lists').select('*').order('created_at'));
    const lists=l.data||[];
    const listId=lists.find(x=>x.id===S.listId)?S.listId:(lists[0]?.id||null);
    let cats=[],prods=[],items=[],catOrder=[],history=[],historyError=null;
    if(listId){
      const [c,p,i,co,h]=await Promise.all([
        sb.from('categories').select('*').eq('list_id',listId).order('position'),
        sb.from('products').select('*').eq('list_id',listId).order('description'),
        sb.from('list_items').select('*').eq('list_id',listId),
        sb.from('list_category_order').select('*').eq('list_id',listId).order('position'),
        sb.from('purchase_history').select('product_id,purchased_at,product_description,category_name,quantity').eq('user_id',S.user.id).order('purchased_at',{ascending:false}).limit(800)
      ]);
      [c,p,i,co].forEach(must);
      cats=(c.data||[]).sort((a,b)=>Number(a.position??0)-Number(b.position??0));
      prods=p.data||[];items=i.data||[];catOrder=co.data||[];
      history=h.data||[];historyError=h.error||null;
    }
    if(seq!==reloadSeq)return;
    if(epoch!==writeEpoch||pendingWrites){
      /* nel frattempo l'utente ha modificato qualcosa: ricarica dopo il salvataggio */
      if(pendingWrites)reloadAfterWrites=true;else reload();
      return;
    }
    Object.assign(S,{lists,listId,cats,prods,items,catOrder,history,historyError,loadError:null});
    S.listName=curList()?.name||'';
    watchList(listId);
    if(listId){
      try{await ensureListRouteOrder();}catch(e){console.error(e);}
      if(seq!==reloadSeq)return;
    }
  }catch(e){
    if(seq!==reloadSeq)return;
    console.error(e);
    S.loadError=e;
  }
  render();
}
function watchList(id){
  if(id===watchedListId)return;
  if(listChannel){sb.removeChannel(listChannel);listChannel=null;}
  clearTimeout(listRefreshTimer);
  watchedListId=id;
  if(!id)return;
  const refresh=()=>{clearTimeout(listRefreshTimer);listRefreshTimer=setTimeout(()=>{if(pendingWrites){reloadAfterWrites=true;return;}reload();},100);};
  listChannel=sb.channel(`shopping-list:${id}`);
  ['categories','products','list_items','list_category_order'].forEach(table=>{
    listChannel.on('postgres_changes',{event:'*',schema:'public',table,filter:`list_id=eq.${id}`},refresh);
  });
  listChannel.on('postgres_changes',{event:'*',schema:'public',table:'shopping_lists',filter:`id=eq.${id}`},refresh);
  listChannel.subscribe(status=>{
    if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.error(t('shareSyncError'),status);
  });
}

async function importJsonToCurrentList(data){
  if(!S.listId)throw new Error(t('noListSelected'));
  if(!data||!Array.isArray(data.categorie)||!data.prodotti||typeof data.prodotti!=='object'||Array.isArray(data.prodotti)){alert(t('invalidJsonFormat'));return false;}
  const names=data.categorie.map(n=>typeof n==='string'?n.trim():'');
  if(names.some(n=>!n)||new Set(names.map(n=>n.toLowerCase())).size!==names.length){alert(t('importDuplicate'));return false;}
  must(await sb.rpc('import_shopping_list',{p_list_id:S.listId,p_data:data}));
  return true;
}

/* ---- suggerimenti automatici ---- */
function daysBetween(a,b){return Math.max(0,Math.round((a-b)/86400000));}
let suggestionsPending=false;
function buildSuggestions(limit=5){
  const due=dueProductsFromHistory(S.history||[]);
  const dueMap=new Map(due.map(d=>[`${normalize(d.description)}::${normalize(d.category_name)}`,d]));
  const activeIds=new Set((S.items||[]).map(i=>i.product_id));
  const out=[];
  for(const p of (S.prods||[])){
    if(activeIds.has(p.id))continue;
    const key=`${normalize(p.description)}::${normalize(catName(p.category_id))}`;
    const hit=dueMap.get(key);
    if(!hit)continue;
    out.push({product:p,score:hit.score});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,limit);
}
async function suggestProductsForCurrentList(){
  if(!S.listId||suggestionsPending)return;
  if(S.historyError)return alert(`${t('historyLoadError')} ${S.historyError.message}`);
  const suggestions=buildSuggestions(40);
  if(!suggestions.length)return alert(t('noSuggested'));
  const listId=S.listId;
  const button=$('suggestProductsButton');
  suggestionsPending=true;
  if(button)button.disabled=true;
  try{
    const rows=suggestions.map(s=>({id:crypto.randomUUID(),list_id:listId,product_id:s.product.id,quantity:1,status:'to_buy'}));
    const {error}=await sb.from('list_items').insert(rows);
    if(error)throw error;
    if(S.listId===listId){
      const activeIds=new Set(S.items.map(item=>item.product_id));
      S.items=[...S.items,...rows.filter(row=>!activeIds.has(row.product_id))];
      render();
    }
    alert(t('suggestedAdded',{count:rows.length}));
  }catch(error){
    alert(`${t('suggestionSaveError')} ${error.message}`);
    await reload();
  }finally{
    suggestionsPending=false;
    if(button)button.disabled=false;
    const currentButton=$('suggestProductsButton');
    if(currentButton)currentButton.disabled=false;
  }
}

async function saveProductEdit(id){const p=prod(id);if(!p) return;const desc=$('editProdDesc').value.trim();const cat=$('editProdCat').value;if(!desc||!cat) return alert(t('saveProductValidation'));let newUrl=null;try{const f=$('editProdImg')?.files?.[0];const payload={description:desc,category_id:cat};if(f){newUrl=await uploadProductImage(f);payload.image_url=newUrl;}must(await sb.from('products').update(payload).eq('id',id));if(newUrl)removeImageFile(p.image_url);hideDialog();}catch(e){if(newUrl)removeImageFile(newUrl);alert(e.message||t('productSaveError'));}reload();}
async function delProd(id){if(!confirm(t('deleteProductConfirm')))return;const p=prod(id);try{must(await sb.from('products').delete().eq('id',id));if(p)removeImageFile(p.image_url);hideDialog();}catch(e){alert(`${t('saveError')} ${e.message||''}`);}reload();}

/* ---- lista: scegliere cosa comprare ---- */
function vNoList(){
  return {html:`<div class="topbar">${listPill()}</div><div class="empty">${icon('list')}<b>${t('createFirst')}</b><span>${t('createFirstHint')}</span></div><form class="inline-form" onsubmit="event.preventDefault(); addList()"><label for="nl" class="sr">${t('newList')}</label><input id="nl" placeholder="${t('newList')}" autocomplete="off" required><button class="btn" type="submit">${t('create')}</button></form>`,cta:''};
}
function pickRow(p,showCat){
  const item=S.items.find(i=>i.product_id===p.id);
  const qty=item?Number(item.quantity||1):1;
  const ctl=item
    ?`<div class="stepper" onclick="event.stopPropagation()"><button type="button" aria-label="${t(qty>1?'decrease':'removeFromList')}: ${esc(p.description)}" onclick="${qty>1?`changeQty('${p.id}',-1)`:`toggleItem('${p.id}')`}">${icon(qty>1?'minus':'x','sm')}</button><span aria-label="${t('quantity')} ${qty}">${qty}</span><button type="button" aria-label="${t('increase')}: ${esc(p.description)}" onclick="changeQty('${p.id}',1)">${icon('plus','sm')}</button></div>`
    :`<button type="button" class="add-circle" aria-label="${t('addToList')}: ${esc(p.description)}" onclick="event.stopPropagation(); toggleItem('${p.id}')">${icon('plus','sm')}</button>`;
  return `<div class="row-item" onclick="toggleItem('${p.id}')">${thumb(p,catColor(p.category_id))}<div class="row-main"><div class="product-name">${esc(p.description)}</div>${showCat?`<div class="product-meta">${esc(catName(p.category_id))}</div>`:''}</div>${ctl}</div>`;
}
function addSuggestion(pid){if(!S.items.some(i=>i.product_id===pid))toggleItem(pid);}
function toggleAllSugg(){SHOW_ALL_SUGG=!SHOW_ALL_SUGG;render();}
function vPick(){
  const l=curList();
  if(!l)return vNoList();
  const toBuy=S.items.filter(i=>i.status!=='purchased').length;
  const top=`<div class="topbar">${listPill()}<div class="actions"><button type="button" class="icon-btn" aria-label="${t('loyaltyCard')}" onclick="showLoyalty()">${icon('card')}</button><button type="button" class="icon-btn" aria-label="${t('shareList')}" onclick="shareList('${l.id}')">${icon('users')}</button><button type="button" class="icon-btn" aria-label="${t('listActions')}" onclick="openPickMenu()">${icon('more')}</button></div></div>
  <div class="head" style="margin-bottom:14px"><div><h1 class="title">${t('whatToBuy')}</h1><p class="subtitle">${t(S.items.length===1?'chosenOne':'chosenCount',{count:S.items.length})}</p></div></div>`;
  const sugg=filterText?[]:buildSuggestions(40);
  const shown=SHOW_ALL_SUGG?sugg:sugg.slice(0,4);
  const suggHtml=sugg.length?`<div class="card sugg"><div class="sugg-head"><span class="sugg-title">${icon('sparkle','sm')}${t('suggestedTitle')}</span><button id="suggestProductsButton" type="button" class="link-btn" ${suggestionsPending?'disabled':''} onclick="suggestProductsForCurrentList()">${t('addAll')}</button></div><div class="chips">${shown.map(s=>`<button type="button" class="chip" onclick="addSuggestion('${s.product.id}')">${icon('plus','sm')}${esc(s.product.description)}</button>`).join('')}${sugg.length>4?`<button type="button" class="chip more" onclick="toggleAllSugg()">${SHOW_ALL_SUGG?t('showLess'):t('moreCount',{count:sugg.length-4})}</button>`:''}</div></div>`:'';
  const all=S.prods.filter(p=>matchesFilter(filterText,p));
  let body;
  if(FLAT)body=all.length?`<div class="group">${[...all].sort(alpha).map(p=>pickRow(p,true)).join('')}</div>`:'';
  else body=orderedCats().map(c=>{
    const ps=all.filter(p=>p.category_id===c.id).sort(alpha);
    if(!ps.length) return '';
    const nSel=ps.filter(p=>S.items.find(i=>i.product_id===p.id)).length;
    return catHead('pick',c.id,c.name,nSel?`${nSel}/${ps.length}`:ps.length,catColor(c.id))+(isCol(colKey('pick',c.id))?'':`<div class="group">${ps.map(p=>pickRow(p,false)).join('')}</div>`);
  }).join('');
  if(!body)body=`<div class="empty">${icon('search')}<b>${t('noProducts')}</b>${S.cats.length?'':`<span>${t('addProductFirst')}</span>`}</div>`;
  const add=canEditCurrentList()?`<button type="button" class="dashed-btn" onclick="openAddProductModal()">${icon('plus','sm')}${t('addProduct')}</button>`:'';
  const cta=toBuy?`<button type="button" class="cta" onclick="go('shop')">${t('goShopping')}<span class="cta-tag">${t(toBuy===1?'oneItem':'itemsCount',{count:toBuy})}${icon('arrowRight','sm')}</span></button>`:'';
  return {html:`${top}${filterBox('pickFilter')}${suggHtml}${viewSeg()}${body}${add}`,cta};
}
function openPickMenu(){
  const item=(ico,label,fn,cls='')=>`<button type="button" class="menu-item ${cls}" onclick="hideDialog(); ${fn}">${icon(ico,'sm')}${label}</button>`;
  showDialog(sheet(t('listActions'),`<div class="group">${canEditCurrentList()?item('plus',t('addProduct'),'openAddProductModal()'):''}${item('chevDown',t('expandAll'),"setAll('pick',false)")}${item('chevRight',t('collapseAll'),"setAll('pick',true)")}${item('refresh',t('refresh'),'reload()')}</div><div class="group">${item('trash',t('clearList'),'clearCurrentList()','danger')}</div>`));
}
/* ---- scritture ottimistiche ----
   Le modifiche allo stesso prodotto partono una dopo l'altra, nell'ordine dei tap:
   così un "aggiungi" seguito da "togli" non può arrivare al server invertito.
   Le righe sono identificate da lista+prodotto, non dall'id locale. */
function queueWrite(key,fn){
  pendingWrites++;writeEpoch++;
  const prev=writeChains.get(key)||Promise.resolve();
  const next=prev.then(fn).then(must).catch(e=>{alert(`${t('saveError')} ${e.message||''}`);reloadAfterWrites=true;}).finally(()=>{
    pendingWrites--;
    if(writeChains.get(key)===next)writeChains.delete(key);
    if(!pendingWrites&&reloadAfterWrites){reloadAfterWrites=false;reload();}
  });
  writeChains.set(key,next);
  return next;
}
const flushWrites=()=>Promise.allSettled([...writeChains.values()]);
const itemRow=(listId,pid,quantity)=>({id:crypto.randomUUID(),list_id:listId,product_id:pid,quantity,status:'to_buy'});
function toggleItem(pid){
  const listId=S.listId,ex=S.items.find(i=>i.product_id===pid);
  if(ex){
    S.items=S.items.filter(i=>i!==ex);render();
    queueWrite(pid,()=>sb.from('list_items').delete().eq('list_id',listId).eq('product_id',pid));
  }else{
    const row=itemRow(listId,pid,1);
    S.items=[...S.items,row];render();
    queueWrite(pid,()=>sb.from('list_items').upsert(row,{onConflict:'list_id,product_id',ignoreDuplicates:true}));
  }
}
function changeQty(pid,delta){
  const listId=S.listId,item=S.items.find(i=>i.product_id===pid);
  const next=Math.max(1,(item?Number(item.quantity||1):1)+delta);
  if(!item){
    const row=itemRow(listId,pid,next);
    S.items=[...S.items,row];render();
    const {id:_localId,...data}=row;/* se la riga esiste già aggiorna solo i dati, non l'id */
    queueWrite(pid,()=>sb.from('list_items').upsert(data,{onConflict:'list_id,product_id'}));
  }else{
    item.quantity=next;render();
    queueWrite(pid,()=>sb.from('list_items').update({quantity:next}).eq('list_id',listId).eq('product_id',pid));
  }
}

/* ---- spesa: in corsia ---- */
function vShop(){
  const l=curList();
  if(!l)return vNoList();
  const items=S.items||[];
  const toBuy=items.filter(i=>i.status!=='purchased'&&prod(i.product_id));
  const bought=items.filter(i=>i.status==='purchased'&&prod(i.product_id));
  const tot=toBuy.length+bought.length,done=bought.length;
  const cats=orderedCats();
  const head=`<div class="head"><div><p class="eyebrow">${esc(l.name)}</p><h1 class="title">${t('inAisle')}</h1></div><button type="button" class="chip-btn" onclick="showLoyalty()">${icon('card','sm')}${t('card')}</button></div>`;
  if(!tot)return {html:`${head}<div class="empty">${icon('basket')}<b>${t('noProductsBuy')}</b><span>${t('noProductsBuyHint')}</span><button type="button" class="btn" onclick="go('pick')">${t('navPick')}</button></div>`,cta:''};
  const nextCat=cats.find(c=>toBuy.some(i=>prod(i.product_id).category_id===c.id));
  const dash=Math.round(201*done/tot);
  const ring=`<div class="ring-card"><div class="ring"><svg role="img" aria-label="${t('ringLabel',{done,total:tot})}" width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--raised)" stroke-width="8"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash} 201" transform="rotate(-90 38 38)"/></svg><b aria-hidden="true">${done}/${tot}</b></div><div class="ring-text"><b>${toBuy.length?t('leftCount',{count:toBuy.length}):t('allTaken')}</b><span>${nextCat?t('nextAisle',{name:esc(nextCat.name)}):t('closeCartHint')}</span></div></div>`;
  const row=(i,isDone)=>{const p=prod(i.product_id);const img=safeImg(p.image_url);return `<button type="button" class="shop-row${isDone?' done':''}" aria-pressed="${isDone}" onclick="buy('${i.id}', ${!isDone})"><span class="check-circle" aria-hidden="true">${isDone?icon('check','sm'):''}</span><span class="row-main"><span class="product-name">${esc(p.description)}</span></span><span class="qty-badge" aria-label="${t('quantity')} ${i.quantity||1}">×${i.quantity||1}</span>${img&&!isDone?thumb(p,catColor(p.category_id)):''}</button>`;};
  let html=head+ring;
  html+=cats.map(c=>{
    const its=toBuy.filter(i=>prod(i.product_id).category_id===c.id);
    if(!its.length)return '';
    return catHead('shop',c.id,c.name,t('toTake',{count:its.length}),catColor(c.id))+(isCol(colKey('shop',c.id))?'':`<div class="shop-list">${its.map(i=>row(i,false)).join('')}</div>`);
  }).join('');
  if(bought.length){
    html+=catHead('shop','bought',t('inCart'),bought.length,'var(--accent)');
    if(!isCol(colKey('shop','bought')))html+=`<div class="shop-list">${cats.map(c=>bought.filter(i=>prod(i.product_id).category_id===c.id).map(i=>row(i,true)).join('')).join('')}</div>`;
  }
  const cta=bought.length?`<button type="button" class="cta center" onclick="closeCart()">${icon('basketCheck')}${t('closeCart')}</button>`:'';
  return {html,cta};
}
function buy(id,v){const it=S.items.find(i=>i.id===id);if(!it)return;const listId=S.listId,pid=it.product_id,status=v?'purchased':'to_buy';it.status=status;render();queueWrite(pid,()=>sb.from('list_items').update({status,updated_at:new Date().toISOString()}).eq('list_id',listId).eq('product_id',pid));}
/* Chiusura carrello in un'unica operazione SQL: registra nello storico e
   rimuove gli articoli acquistati insieme, leggendoli dal database. */
async function closeCart(){
  if(!confirm(t('closeCartConfirm'))) return;
  const listId=S.listId;
  if(!listId)return;
  try{
    await flushWrites();
    must(await sb.rpc('close_shopping_cart',{p_list_id:listId}));
  }catch(e){
    alert(`${t('closeCartError')} ${e.message||''}`);
  }
  reload();
}
function openPhotoModal(url){url=safeImg(url);if(!url)return;$('photoModalImg').src=url;$('photoModal').classList.add('open');}
function hidePhotoModal(){$('photoModal').classList.remove('open');$('photoModalImg').src='';}
function closePhotoModal(event){if(event.target.id==='photoModal') hidePhotoModal();}
